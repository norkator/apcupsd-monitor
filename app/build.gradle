apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "com.nitramite.apcupsdmonitor"
        minSdk = 23
        targetSdk = 37
        versionCode = 66
        versionName = "1.28.1" // Use Semver
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
    namespace = 'com.nitramite.apcupsdmonitor'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation 'com.jcraft:jsch:0.1.55'
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    // Third party
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.wdullaer:swipeactionadapter:2.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'joda-time:joda-time:2.14.3'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    // For the notifications
    implementation 'com.google.firebase:firebase-messaging:25.1.1'
    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    testImplementation 'org.json:json:20260719'
    // Other
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.4.10'))
    implementation('com.google.android.play:review:2.0.2')
}
